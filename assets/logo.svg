<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Guardião">
  <title>Guardião</title>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1F2E"/>
      <stop offset="1" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="escudo" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="0.55" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="miolo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cartao" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E5E7EB"/>
      <stop offset="1" stop-color="#9CA3AF"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#fundo)"/>
  <circle cx="256" cy="236" r="230" fill="url(#brilho)"/>

  <!-- escudo -->
  <path d="M256 70 L400 120 C 400 250 360 360 256 430 C 152 360 112 250 112 120 Z"
        fill="url(#escudo)"/>
  <path d="M256 102 L374 143 C 372 252 338 340 256 398 C 174 340 140 252 138 143 Z"
        fill="url(#miolo)"/>

  <!-- cartão CompactFlash -->
  <g transform="translate(256 248) rotate(-8)">
    <rect x="-70" y="-88" width="140" height="164" rx="12" fill="url(#cartao)"/>
    <path d="M-70 -66 L-70 -76 Q-70 -88 -58 -88 L58 -88 Q70 -88 70 -76 L70 -66 Z" fill="#6B7280"/>
    <g fill="#374151">
      <rect x="-56" y="-84" width="6" height="12" rx="1"/>
      <rect x="-44" y="-84" width="6" height="12" rx="1"/>
      <rect x="-32" y="-84" width="6" height="12" rx="1"/>
      <rect x="-20" y="-84" width="6" height="12" rx="1"/>
      <rect x="-8" y="-84" width="6" height="12" rx="1"/>
      <rect x="4" y="-84" width="6" height="12" rx="1"/>
      <rect x="16" y="-84" width="6" height="12" rx="1"/>
      <rect x="28" y="-84" width="6" height="12" rx="1"/>
      <rect x="40" y="-84" width="6" height="12" rx="1"/>
      <rect x="52" y="-84" width="6" height="12" rx="1"/>
    </g>
    <rect x="-50" y="-44" width="100" height="18" rx="4" fill="#4B5563" opacity="0.55"/>
    <rect x="-50" y="-18" width="64" height="10" rx="3" fill="#4B5563" opacity="0.4"/>
  </g>

  <!-- selo de confirmação -->
  <circle cx="318" cy="316" r="50" fill="#10B981"/>
  <circle cx="318" cy="316" r="50" fill="none" stroke="#0B0F19" stroke-width="10"/>
  <path d="M296 317 L312 333 L342 300" fill="none" stroke="#ECFDF5" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
